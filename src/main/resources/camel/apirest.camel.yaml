- route:
    id: getAllclientes
    description: getAllClients
    from:
      id: from-d90c
      uri: direct
      parameters:
        name: getAllclientes
      steps:
        - log:
            id: log-dfb4
            message: "ESTA ES UNA PRUEBA    :   [. ${body}.  ]"
        - to:
            id: to-485d
            uri: kamelet:mariadb-sink
            parameters:
              username: "{{spring.datasource.username}}"
              password: "{{spring.datasource.password}}"
              serverPort: 18273
              serverName: mysql-23bdb174-karavan-project-api.d.aivencloud.com
              databaseName: defaultdb
              query: |-
                SELECT id, nombre, apellido, email, rut,
                DATE_FORMAT(fecha_nacimiento, '%Y-%m-%d') AS fecha_nacimiento, 
                telefono FROM clientes
        - choice:
            id: choice-b700
            when:
              - id: when-8350
                expression:
                  simple:
                    id: simple-76cf
                    expression: ${body} == '[]'
                steps:
                  - setHeader:
                      id: setHeader-83e8
                      name: Exchange.HTTP_RESPONSE_CODE
                      expression:
                        constant:
                          id: constant-07bd
                          expression: "404"
                  - setBody:
                      id: setBody-3712
                      expression:
                        constant:
                          id: constant-e305
                          expression: "{\"message\": \"Item not found\"}"
            otherwise:
              id: otherwise-f9ef
              steps:
                - setHeader:
                    id: setHeader-b09b
                    name: Exchange.HTTP_RESPONSE_CODE
                    expression:
                      constant:
                        id: constant-9001
                        expression: "200"
                - marshal:
                    id: marshal-6e0f
                    json:
                      id: json-1ebf
                      prettyPrint: true
                      library: Jackson
